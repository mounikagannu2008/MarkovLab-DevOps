apiVersion: v1
kind: Service
metadata: { name: markov-engine }
spec:
  selector: { app: markov-engine }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata: { name: markov-api }
spec:
  selector: { app: markov-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: markov-ui }
spec:
  type: NodePort
  selector: { app: markov-ui }
  ports: [{ port: 8501, targetPort: 8501, nodePort: 30501 }]
