services:
  engine:
    build: ./engine
    ports: ["8000:8000"]
  api:
    build: ./api
    environment: { ENGINE_URL: "http://engine:8000" }
    ports: ["8081:8080"]
    depends_on: [engine]
  ui:
    build: ./ui
    environment: { API_URL: "http://api:8080" }
    ports: ["8501:8501"]
    depends_on: [api]
